[env:nucleo_h723zg]
platform = ststm32
board = nucleo_h723zg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_port = COM6
extra_scripts = pre:extra_scripts/link_hardfloat.py
build_unflags =
  -Os
build_flags =
  -O3
  -funroll-loops
  -D USE_HAL_DRIVER
  -D STM32H723xx
  -mfpu=fpv5-d16
  -mfloat-abi=hard
  -Wl,-u,_printf_float
  -Wall
  -Wextra
